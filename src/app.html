<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Verificación para consolas de SEO -->
    <meta name="google-site-verification" content="1XFsrJ6ht6FZhD4gvkwYzTjFhQSo7ymgGxr0xouNV9s">
    <meta name="yandex-verification" content="603a40c50ed97d75">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SMMUN" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

    <!-- Información de la página -->
    <!-- <meta property="og:image" content="https://smmun.com/assets/img/images/greeting.webp"> -->
    <meta property="og:site_name" content="SMMUN">

    <!-- Precargar fuentes -->
    <link rel="preload" href="/assets/fonts/catchy_mager-webfont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/the_seasons-webfont.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-size: min(clamp(0.75rem, 1.5vw + 0.1875rem, 1.5rem), 2.5vh);
        }

        body {
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        @media screen and (min-width: 820px) {
            body {
                margin-top: calc(8vh + 2rem) !important;
                min-height: calc(100vh - 8vh - 2rem);
            }
        }

        @media screen and (max-width: 820px) {
            body {
                margin-top: calc(5vh + 2rem) !important;
                min-height: calc(100vh - 8vh - 2rem);
            }
        }

        main {
            flex: 1;
        }

        i {
            text-rendering: optimizeLegibility;
        }

        figure {
            margin: 0;
        }

        @font-face {
            font-family: "Catchy Mager";
            src: url("/assets/fonts/catchy_mager-webfont.woff2");
        }

        @font-face {
            font-family: "The Seasons";
            src: url("/assets/fonts/the_seasons-webfont.woff2");
        }
    </style>

    %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
</body>
