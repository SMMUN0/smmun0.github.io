<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Verificación para consolas de SEO -->
    <meta name="google-site-verification" content="1XFsrJ6ht6FZhD4gvkwYzTjFhQSo7ymgGxr0xouNV9s">
    <meta name="yandex-verification" content="603a40c50ed97d75">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png">
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest">
    <link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg" color="#5bbad5">
    <link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico">
    <meta name="msapplication-TileColor" content="#603cba">
    <meta name="theme-color" content="#ffffff">

    <!-- Información de la página -->
    <meta property="og:image" content="https://smmun.com/assets/img/images/greeting.webp">
    <meta property="og:site_name" content="SMMUN">

    <!-- Precargar fuentes -->
    <link rel="preload" href="/assets/fonts/GlacialIndifference-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/GlacialIndifference-Italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/GlacialIndifference-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/TheSeasons-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/TheSeasons-Regular.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Precargar logo -->
    <link rel="preload" as="image" href="/assets/img/logos/smmun_deg.webp">

    <style>
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-size: min(clamp(0.75rem, 1.5vw + 0.1875rem, 1.5rem), 2.5vh);
        }

        body {
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #fffdfd;
            background-image: url("/assets/img/backgrounds/white_bg.webp");
            background-repeat: repeat;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        @media screen and (min-width: 820px) {
            body {
                margin-top: 13.5vh !important;
                min-height: calc(100vh - 13.5vh);
            }
        }

        @media screen and (max-width: 820px) {
            body {
                margin-top: 8vh !important;
                min-height: calc(100vh - 8vh);
            }
        }

        main {
            flex: 1;
        }

        i {
            text-rendering: optimizeLegibility;
        }

        @font-face {
            font-family: "Glacial Indifference Regular";
            src: url("/assets/fonts/GlacialIndifference-Regular.woff2");
        }

        @font-face {
            font-family: "Glacial Indifference Italic";
            src: url("/assets/fonts/GlacialIndifference-Italic.woff2");
        }

        @font-face {
            font-family: "Glacial Indifference Bold";
            src: url("/assets/fonts/GlacialIndifference-Bold.woff2");
        }

        @font-face {
            font-family: "The Seasons Regular";
            src: url("/assets/fonts/TheSeasons-Regular.woff2");
        }

        @font-face {
            font-family: "The Seasons Bold";
            src: url("/assets/fonts/TheSeasons-Bold.woff2");
        }
    </style>

    %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
</body>
